<script>
'use strict';
/* =====================================================================
   Floaters behind closed eyelids — a physically based entoptic simulation
   Units: millimetres, seconds, radians (degrees only for gaze & screen).
   Eye frame: origin at the eye's centre of rotation, +z anterior (out of
   the cornea), +x subject's right, +y up.  Simulated eye: the right eye.
   ===================================================================== */

// ---------- small math ----------
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
const sq = x => x * x;
function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
const noiseRng = mulberry32(90210);
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const len3 = a => Math.hypot(a[0], a[1], a[2]);
const nrm = a => scl(a, 1 / len3(a));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
// rotations in this file's convention: rotY(+) turns +z toward +x, rotX(+) turns +z toward +y
const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; };
const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c + p[2] * s, -p[1] * s + p[2] * c]; };
function inv3(m) { // row-major 3x3
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [A / det, -(b * i - c * h) / det, (b * f - c * e) / det,
          B / det, (a * i - c * g) / det, -(a * f - c * d) / det,
          C / det, -(a * h - b * g) / det, (a * e - b * d) / det];
}
const mul3 = (m, n) => { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = m[i * 3] * n[j] + m[i * 3 + 1] * n[3 + j] + m[i * 3 + 2] * n[6 + j]; return r; };
const apply3 = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

// ---------- schematic eye (Gullstrand-like distances, simplified) ----------
const EYE = {
  Cv: [0, 0, 0.5],   // centre of the vitreous cavity
  Rv: 11.0,          // cavity radius = retina; posterior pole at z = -10.5
  zLens: 5.9,        // back of the crystalline lens: vitreous lies behind this
  E: [0, 0, 9.8],    // exit pupil centre: rays in the vitreous converge from here
  N: [0, 0, 6.2],    // posterior nodal point, 16.7 mm in front of the fovea
  zEnt: 10.5,        // entrance pupil, 3 mm behind the corneal apex
  Rlid: 14.2,        // inner surface of the closed lid, about the rotation centre
  lamMed: 650e-6 / 1.336,               // effective wavelength inside the vitreous (mm)
  k: 2 * Math.PI * 1.336 / 650e-6,      // wavenumber in the vitreous (1/mm)
};
EYE.L = EYE.E[2] - (EYE.Cv[2] - EYE.Rv); // exit pupil → fovea, 20.3 mm

// ---------- spectral optics: sun → eyelid → ocular media → cones ----------
// Prahl's molar extinction of oxy- / deoxy-haemoglobin (cm^-1 / M), 400–730 nm in 10 nm steps
const HB_O = [266232,466840,480360,214120,102580,62816,44480,33209.2,26629.2,23684.4,20932.8,20035.2,24202.4,39956.8,53236,43016,32613.2,44496,50104,14400.8,3200,1506,942,610,442,368,319.6,294,277.6,276,290,314,348,390];
const HB_D = [223296,303956,407560,528600,413280,103292,23388.8,16156.4,14550,16684,20035.2,25773.6,31589.6,39036.4,46592,53412,53788,45072,37020,28324.4,14677.2,9443.6,6509.6,5148.8,4345.2,3750.12,3226.56,2795.12,2407.92,2051.96,1794.28,1540.48,1325.88,1102.2];
const HPE = [0.4002, 0.7076, -0.0808, -0.2263, 1.1653, 0.0457, 0, 0, 0.9182];   // XYZ → LMS (D65 → 1,1,1)
const HPE_INV = inv3(HPE);
const XYZ2RGB = [3.2406, -1.5372, -0.4986, -0.9689, 1.8758, 0.0415, 0.0557, -0.2040, 1.0570];
const LMS2RGB = mul3(XYZ2RGB, HPE_INV);
const lumOf = lms => HPE_INV[3] * lms[0] + HPE_INV[4] * lms[1] + HPE_INV[5] * lms[2];

const SPEC = (() => {
  const wl = []; for (let l = 400; l <= 730; l += 5) wl.push(l);
  const g = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  // CIE 1931 2° observer, multi-lobe fit (Wyman, Sloan & Shirley 2013)
  const cmf = wl.map(l => [
    1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2),
    0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1),
    1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8)]);
  const planck = l => { const m = l * 1e-9; return 1 / (Math.pow(m, 5) * (Math.exp(1.4388e-2 / (m * 5600)) - 1)); };
  const p0 = planck(560);
  const sun = wl.map(l => planck(l) / p0);                                       // sun + sky ≈ 5600 K
  const media = wl.map(l => Math.pow(10, -(1.1 * Math.exp(-(l - 400) / 26) + 0.015))); // cornea + lens
  const hb = (arr, l) => { const f = (l - 400) / 10, i = Math.min(32, Math.floor(f)), t = f - i; return arr[i] * (1 - t) + arr[i + 1] * t; };
  const cHb = 150 / 64500;                                                        // mol/L haemoglobin in blood
  // Diffusion theory: effective attenuation of eyelid tissue, mu_eff = sqrt(3 mua (mua + mus'))
  const muEff = wl.map(l => {
    const eps = 0.85 * hb(HB_O, l) + 0.15 * hb(HB_D, l);                         // capillary-venous mix, SO2 85%
    const muaBlood = 2.303 * eps * cHb / 10;                                      // 1/mm
    const muaMel = 6.6e10 * Math.pow(l, -3.33);                                   // inside melanosomes, 1/mm
    const muaBase = (0.0244 + 8.53 * Math.exp(-(l - 154) / 66.2)) / 10;          // bloodless tissue
    const mua = 0.03 * muaBlood + 0.0015 * muaMel + muaBase;                      // 3% blood, thin epidermis
    const musp = 2.4 * Math.pow(l / 500, -1.3);                                   // reduced scattering, 1/mm
    return Math.sqrt(3 * mua * (mua + musp));
  });
  const LID_MM = 0.9, T_PRE = 0.13;                                               // lid thickness, boundary losses
  const lidT = (i, m) => T_PRE * Math.exp(-muEff[i] * LID_MM * m);
  function lmsFor(m) {
    let X = 0, Y = 0, Z = 0;
    for (let i = 0; i < wl.length; i++) {
      const p = sun[i] * lidT(i, m) * media[i];
      X += p * cmf[i][0]; Y += p * cmf[i][1]; Z += p * cmf[i][2];
    }
    return apply3(HPE, [X, Y, Z]);
  }
  // Look-up table over lid optical thickness m (1 = gently closed lid)
  const N = 64, M0 = 0.5, M1 = 9.0;
  const log0 = Math.log(M0), logK = (N - 1) / (Math.log(M1) - log0);
  const ref = lumOf(lmsFor(1));
  const lut = new Float32Array(N * 3);
  for (let j = 0; j < N; j++) {
    const m = Math.exp(log0 + j / logK);
    const c = lmsFor(m);
    lut[j * 3] = c[0] / ref; lut[j * 3 + 1] = c[1] / ref; lut[j * 3 + 2] = c[2] / ref;
  }
  function lutAt(m) {
    const f = clamp((Math.log(m) - log0) * logK, 0, N - 1.001), i = Math.floor(f), t = f - i;
    return [lerp(lut[i * 3], lut[i * 3 + 3], t), lerp(lut[i * 3 + 1], lut[i * 3 + 4], t), lerp(lut[i * 3 + 2], lut[i * 3 + 5], t)];
  }
  // transmitted spectrum reaching the retina, for the explainer chart
  function spectrum(m) { return wl.map((l, i) => sun[i] * lidT(i, m) * media[i]); }
  function transAt(l, m) { const i = Math.round((l - 400) / 5); return lidT(i, m); }
  return { wl, lut, lutAt, log0, logK, N, spectrum, transAt };
})();

// ---------- scene: posture, sun ----------
const SCENE = { recline: 10 * DEG, sunUp: 22 * DEG, sunRight: 8 * DEG };   // sitting, face tipped up toward the sun
const UP_HEAD = [0, Math.cos(SCENE.recline), Math.sin(SCENE.recline)];
const G_HEAD = scl(UP_HEAD, -1);
function sunDirHead(t) {
  const breath = 0.35 * DEG * Math.sin(2 * Math.PI * t / 4.2);            // head rises and falls with breathing
  return nrm(rotY(rotX([0, 0, 1], SCENE.sunUp + breath), SCENE.sunRight));
}
function eyeMatrix(yaw, pitch) {   // eye → head, row-major (Fick: yaw then pitch)
  const c0 = rotY(rotX([1, 0, 0], pitch), yaw), c1 = rotY(rotX([0, 1, 0], pitch), yaw), c2 = rotY(rotX([0, 0, 1], pitch), yaw);
  return [c0[0], c1[0], c2[0], c0[1], c1[1], c2[1], c0[2], c1[2], c2[2]];
}
const colMajor = m => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
const dirFromView = (vx, vy) => {   // visual-field angle (deg, equidistant) → unit direction in the eye frame
  const e = Math.hypot(vx, vy) * DEG, az = Math.atan2(vy, vx);
  return [Math.sin(e) * Math.cos(az), Math.sin(e) * Math.sin(az), Math.cos(e)];
};

// ---------- eyelid: optical thickness map (head-fixed, mm on the lid) — mirrored in the shader ----------
function lidThick(x, y, s, ym) {
  let t = 1;
  t += 0.85 * Math.exp(-sq((y - ym) / 1.35));                     // lid margins meet: tarsal edges, lash roots
  t += 0.55 * smooth(5, 9.5, y);                                   // above the tarsus: muscle, septum, fat
  t += 0.30 * (1 - smooth(ym - 6.5, ym - 1.5, y));                 // lower lid → cheek
  t += 0.45 * smooth(7, 12, Math.abs(x + 0.8));                    // canthi
  const f = Math.exp(-sq((y - 3.1 - 0.4 * Math.sin(x * 0.35 + 1)) / 0.75))
          + 0.8 * Math.exp(-sq((y - 6.0 - 0.5 * Math.sin(x * 0.27 - 0.6)) / 0.85))
          + 0.7 * Math.exp(-sq((y - ym + 2.3 - 0.3 * Math.sin(x * 0.4)) / 0.65));
  return t + s * s * 0.75 * f;                                     // skin folds bunch up when squeezing
}
// retinal LMS for a visual direction u (eye frame), ignoring floaters
function lidLight(u, L, area) {
  const Q = L.Q, uh = apply3(Q, u), pe = apply3(Q, [0, 0, EYE.zEnt]);
  const b = dot(pe, uh), c = dot(pe, pe) - EYE.Rlid * EYE.Rlid, t = -b + Math.sqrt(b * b - c);
  const X = add(pe, scl(uh, t)), n = scl(X, 1 / EYE.Rlid);
  const brow = 1 - smooth(10.2, 13, X[1] + (17 - X[2]) * L.sunTan);
  const E = (0.84 * Math.max(dot(n, L.sun), 0) * brow + 0.16 * (0.55 + 0.45 * dot(n, UP_HEAD))) * L.shade;
  const F = 1 + L.beta * Math.exp(2.2 * (dot(uh, L.sun) - 1));
  const c3 = SPEC.lutAt(L.ms * lidThick(X[0], X[1], L.s, L.ym));
  const k = E * F * area * (0.35 + 0.65 * u[2]);
  return [c3[0] * k + L.veil[0], c3[1] * k + L.veil[1], c3[2] * k + L.veil[2]];
}

// ---------- physiological state ----------
const SIM = { t: 0 };
const LID = { level: 0.1, hold: 0, s: 0.1, touchedAt: -10 };
const HEART = { phase: 0, pulse: 0, bpm: 64 };
const PUPIL = { d: 3.3, drive: 3.3, hip: 0 };
const ADAPT = { fast: [5, 5, 5], slow: [5, 5, 5] };       // starts light-adapted to open-eyed daylight
const GAZE = { target: [0, 0], minAmp: 0.7, sacPos: [0, 0], sac: null, lastEnd: -1, refract: 0.2, drift: [0, 0], bell: 0, yaw: 0, pitch: 0 };
const pupilArea = p => (Math.PI / 0.05) * (1 - Math.exp(-0.05 * p * p / 4));   // Stiles–Crawford weighted
const AREA_REF = pupilArea(3.3);

function stepLid(dt) {
  const target = Math.max(LID.level, LID.hold ? 1 : 0);
  LID.s += (target - LID.s) * (1 - Math.exp(-dt / (target > LID.s ? 0.09 : 0.24)));
}
function stepHeart(dt) {
  HEART.phase = (HEART.phase + dt * HEART.bpm / 60) % 1;
  const x = HEART.phase;
  HEART.pulse = Math.exp(-sq((x - 0.14) / 0.07)) + 0.35 * Math.exp(-sq((x - 0.42) / 0.09));
}
// Saccades: main-sequence duration, minimum-jerk profile, undershoot + corrective saccade
function planSaccade(t) {
  if (GAZE.sac || t - GAZE.lastEnd < GAZE.refract) return;
  const ex = GAZE.target[0] - GAZE.sacPos[0], ey = GAZE.target[1] - GAZE.sacPos[1], A = Math.hypot(ex, ey);
  if (A < GAZE.minAmp) return;
  const gain = A > 6 ? 0.88 + 0.07 * noiseRng() : 1;
  GAZE.sac = { t0: t, D: (21 + 2.2 * A * gain) / 1000, from: GAZE.sacPos.slice(), to: [GAZE.sacPos[0] + ex * gain, GAZE.sacPos[1] + ey * gain] };
}
function advanceSaccade(t) {
  const s = GAZE.sac; if (!s) return;
  const u = clamp((t - s.t0) / s.D, 0, 1), p = u * u * u * (10 - 15 * u + 6 * u * u);
  GAZE.sacPos[0] = lerp(s.from[0], s.to[0], p); GAZE.sacPos[1] = lerp(s.from[1], s.to[1], p);
  if (u >= 1) { GAZE.sac = null; GAZE.lastEnd = t; GAZE.refract = 0.13 + 0.1 * noiseRng(); }
}

// ---------- vitreous gel: torsional Kelvin–Voigt sphere ----------
// Each spherical shell turns rigidly by chi(r,t):  chi_tt = (c² + nu ∂t) · r⁻⁴ ∂r(r⁴ ∂r chi),
// no-slip at r = Rv (the eye wall).  c = shear-wave speed sqrt(G/rho), nu = eta/rho.
// G ≈ 0.63 Pa, eta ≈ 0.06 Pa·s: a partly liquefied adult vitreous → first mode ≈ 1.6 Hz, ζ ≈ 0.5.
const NR = 28, DR = EYE.Rv / NR;
const VIT = { c2: 25 * 25, nu: 60, chi: [new Float64Array(NR), new Float64Array(NR)], vel: [new Float64Array(NR), new Float64Array(NR)], wall: [0, 0], wallVel: [0, 0] };
const rN = new Float64Array(NR), r4 = new Float64Array(NR), Fm = new Float64Array(NR), Fp = new Float64Array(NR);
for (let i = 0; i < NR; i++) {
  rN[i] = (i + 0.5) * DR; r4[i] = rN[i] ** 4;
  Fm[i] = i > 0 ? (i * DR) ** 4 : 0;
  Fp[i] = i < NR - 1 ? ((i + 1) * DR) ** 4 : 2 * EYE.Rv ** 4;   // last face: half a cell to the wall
}
const TA = new Float64Array(NR), TB = new Float64Array(NR), TC = new Float64Array(NR), TD = new Float64Array(NR), CP = new Float64Array(NR), DP = new Float64Array(NR);
function pdeStep(k, wall, wallVel, h) {
  const chi = VIT.chi[k], vel = VIT.vel[k], inv = 1 / (DR * DR);
  for (let i = 0; i < NR; i++) {
    const w = inv / r4[i];
    const cN = i < NR - 1 ? chi[i + 1] : wall, cP = i > 0 ? chi[i - 1] : 0;
    const lap = w * (Fp[i] * (cN - chi[i]) - Fm[i] * (chi[i] - cP));
    const am = h * VIT.nu * w * Fm[i], ap = h * VIT.nu * w * Fp[i];
    TA[i] = -am; TB[i] = 1 + am + ap; TC[i] = -ap;
    TD[i] = vel[i] + h * VIT.c2 * lap;                       // elastic part explicit, viscous part implicit
    if (i === NR - 1) { TD[i] += ap * wallVel; TC[i] = 0; }
  }
  CP[0] = TC[0] / TB[0]; DP[0] = TD[0] / TB[0];
  for (let i = 1; i < NR; i++) { const m = TB[i] - TA[i] * CP[i - 1]; CP[i] = TC[i] / m; DP[i] = (TD[i] - TA[i] * DP[i - 1]) / m; }
  vel[NR - 1] = DP[NR - 1];
  for (let i = NR - 2; i >= 0; i--) vel[i] = DP[i] - CP[i] * vel[i + 1];
  for (let i = 0; i < NR; i++) chi[i] += h * vel[i];
}
function fieldAt(arr, wallV, r) {
  const f = r / DR - 0.5;
  if (f <= 0) return arr[0];
  if (f >= NR - 1) { const t = clamp((r - rN[NR - 1]) / (EYE.Rv - rN[NR - 1]), 0, 1); return arr[NR - 1] * (1 - t) + wallV * t; }
  const i = Math.floor(f), t = f - i; return arr[i] * (1 - t) + arr[i + 1] * t;
}
const chiAt = (k, r) => fieldAt(VIT.chi[k], VIT.wall[k], r);
const velAt = (k, r) => fieldAt(VIT.vel[k], VIT.wallVel[k], r);

// ---------- floaters: clouds of small scatterers / phase objects in the gel ----------
const MAXB = 20000;
const B = { n: 0, x: new Float32Array(MAXB), y: new Float32Array(MAXB), z: new Float32Array(MAXB),
  sig: new Float32Array(MAXB), alpha: new Float32Array(MAXB), phase: new Float32Array(MAXB),
  cx: new Float32Array(MAXB), cy: new Float32Array(MAXB), cz: new Float32Array(MAXB) };
let FL = [];
function addBlob(p, sig, alpha, phase) {
  if (B.n >= MAXB) return;
  const i = B.n++;
  B.x[i] = p[0]; B.y[i] = p[1]; B.z[i] = p[2]; B.sig[i] = sig; B.alpha[i] = alpha; B.phase[i] = phase;
}
// w: stiffness of its tether to the surrounding gel (rad/s), tau: drag time in its liquid pocket (s),

const GLSL_COMMON = `
float sq(float x){ return x * x; }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
`;
const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

// Each blob's shadow: a uniform pupil-shaped disk (radius b) softened by a Gaussian (a = √2σ),
// normalised to unit area, plus its Laplacian for the transport-of-intensity (phase) term.
const VS_BLOB = `#version 300 es
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 aA;
layout(location = 2) in vec4 aB;
uniform vec2 uRes;
out vec2 vOff;
flat out vec3 vP;
flat out vec2 vK;
void main(){
  vOff = aCorner * aA.z;
  vP = vec3(aA.w, aB.x, aB.y);
  vK = aB.zw;
  gl_Position = vec4((aA.xy + vOff) / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS_BLOB = `#version 300 es
precision highp float;
in vec2 vOff;
flat in vec3 vP;
flat in vec2 vK;
out vec4 o;
float sq(float x){ return x * x; }
float erf_(float x){ float s = sign(x); x = abs(x); float t = 1.0 / (1.0 + 0.3275911 * x);
  return s * (1.0 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * exp(-x * x)); }
void main(){
  float r = length(vOff), b = vP.x, a = vP.y, iN = vP.z, ia = 1.0 / a;
  const float RSQPI = 0.5641896;
  float P = 0.5 * (erf_((b - r) * ia) + erf_((b + r) * ia));
  float g1 = exp(-sq((r - b) * ia)), g2 = exp(-sq((r + b) * ia));
  float d2 = 2.0 * ia * ia * ia * RSQPI * ((r - b) * g1 - (r + b) * g2);
  float d1r = r > 0.02 * a ? (g2 - g1) * ia * RSQPI / r : -4.0 * b * exp(-sq(b * ia)) * ia * ia * ia * RSQPI;
  o = vec4(vK.x * P * iN, vK.y * (d2 + d1r) * iN, 0.0, 0.0);
}`;

// Retinal irradiance: sunlit eyelid → pupil → (floater shadows) → retina, in cone space (LMS)
const FS_RETINA = `#version 300 es
precision highp float;
uniform vec2 uRes, uCenter;
uniform float uPpd;
uniform mat3 uQ;
uniform vec3 uSun, uUp, uVeil;
uniform float uSunTan, uS, uMs, uYm, uBeta, uShade, uArea, uFG, uLog0, uLogK;
uniform vec3 uLut[64];
uniform sampler2D uShadow;
out vec4 o;
${GLSL_COMMON}
vec3 lut(float m){ float f = clamp((log(m) - uLog0) * uLogK, 0.0, 62.999); int i = int(f); return mix(uLut[i], uLut[i + 1], f - float(i)); }
float lidThick(vec2 p){
  float t = 1.0;
  t += 0.85 * exp(-sq((p.y - uYm) / 1.35));
  t += 0.55 * smoothstep(5.0, 9.5, p.y);
  t += 0.30 * (1.0 - smoothstep(uYm - 6.5, uYm - 1.5, p.y));
  t += 0.45 * smoothstep(7.0, 12.0, abs(p.x + 0.8));
  float f = exp(-sq((p.y - 3.1 - 0.4 * sin(p.x * 0.35 + 1.0)) / 0.75))
          + 0.8 * exp(-sq((p.y - 6.0 - 0.5 * sin(p.x * 0.27 - 0.6)) / 0.85))
          + 0.7 * exp(-sq((p.y - uYm + 2.3 - 0.3 * sin(p.x * 0.4)) / 0.65));
  t += uS * uS * 0.75 * f;
  // capillaries and skin texture of the lid, already blurred by the pupil aperture
  return t * (1.0 + 0.05 * (vnoise(p * 0.55 + 3.1) - 0.5) + 0.03 * (vnoise(p * 1.4 + 9.7) - 0.5));
}
void main(){
  vec2 v = (gl_FragCoord.xy - uCenter) / uPpd;
  float lv = length(v), e = min(lv, 88.0) * 0.01745329;
  vec2 dir = lv > 1e-5 ? v / lv : vec2(1.0, 0.0);
  vec3 u = vec3(sin(e) * dir, cos(e));
  vec3 uh = uQ * u, pe = uQ * vec3(0.0, 0.0, 10.5);
  float bq = dot(pe, uh), cq = dot(pe, pe) - 14.2 * 14.2;
  vec3 X = pe + uh * (-bq + sqrt(bq * bq - cq));
  vec3 n = X / 14.2;
  float brow = 1.0 - smoothstep(10.2, 13.0, X.y + (17.0 - X.z) * uSunTan);
  float E = (0.84 * max(dot(n, uSun), 0.0) * brow + 0.16 * (0.55 + 0.45 * dot(n, uUp))) * uShade;
  float F = 1.0 + uBeta * exp(2.2 * (dot(uh, uSun) - 1.0));
  vec3 lms = lut(uMs * lidThick(X.xy)) * (E * F * uArea * (0.35 + 0.65 * u.z));
  vec2 sh = texelFetch(uShadow, ivec2(gl_FragCoord.xy), 0).rg;
  float T = exp(-sh.r * uFG) * exp(-clamp(sh.g * uFG, -0.6, 2.5));
  float yb = dot(lms, vec3(0.62, 0.38, 0.0)), yv = dot(uVeil, vec3(0.62, 0.38, 0.0));
  o = vec4(lms + uVeil, mix(1.0, T, yb / max(yb + yv, 1e-6)));   // rgb: glow, a: shadow transmission
}`;

// Local retinal adaptation map (slow, low resolution): causes fading of still shadows and afterimages
const FS_ADAPT = `#version 300 es
precision highp float;
uniform sampler2D uRet, uPrev;
uniform vec2 uRes, uTexel;
uniform float uK;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 a = texture(uRet, uv + uTexel * vec2(-1.0, -1.0)), b = texture(uRet, uv + uTexel * vec2(1.0, -1.0));
  vec4 c = texture(uRet, uv + uTexel * vec2(-1.0, 1.0)), d = texture(uRet, uv + uTexel * vec2(1.0, 1.0));
  vec3 s = 0.25 * (a.rgb * a.a + b.rgb * b.a + c.rgb * c.a + d.rgb * d.a);
  o = vec4(mix(texture(uPrev, uv).rgb, s, uK), 1.0);
}`;

// Perception: cone adaptation (global + local), noise, pressure phosphenes, gamut mapping, tone curve
const FS_PERCEIVE = `#version 300 es
precision highp float;
uniform sampler2D uRet, uAdapt;
uniform vec2 uRes, uCenter;
uniform float uPpd, uDl, uExpo, uTime, uPhos, uPulse, uSpark, uShim, uSeed;
uniform vec3 uGain, uAglob;
uniform mat3 uL2R;
out vec4 o;
${GLSL_COMMON}
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
uvec3 pcg3d(uvec3 v){ v = v * 1664525u + 1013904223u; v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u; v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y; return v; }
vec3 rnd3(ivec2 c, int k){ return vec3(pcg3d(uvec3(ivec3(c, k)))) * (1.0 / 4294967295.0); }
// Photon and neural noise, pooled over receptive fields ~0.1–0.2° wide: sparse blurry specks that
// twinkle for 0.1–0.3 s (and dart a little) at random places across the retina.
float sparkle(vec2 v, float t){
  const float CELL = 0.42;
  ivec2 gi = ivec2(floor(v / CELL));
  float s = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = gi + ivec2(i, j);
    vec3 h0 = rnd3(c, 0);
    float ph = t / (0.10 + 0.22 * h0.y) + 10.0 * h0.x, kf = floor(ph), f = ph - kf;
    vec3 h1 = rnd3(c, int(kf) + 1), h2 = rnd3(c + ivec2(7919, 1049), int(kf) + 1);
    float env = sin(3.14159265 * f); env *= env;
    vec2 p = (vec2(c) + h1.xy) * CELL + (h2.xy - 0.5) * 0.25 * f;
    float sz = 0.06 + 0.10 * h2.z;
    s += h1.z * h1.z * h1.z * env * exp(-dot(v - p, v - p) / (sz * sz));
  }
  return s;
}
float shimmer(vec2 p, float t){   // smooth fluctuation, ~70 ms correlation
  float tt = t * 14.0, kf = floor(tt), f = smoothstep(0.0, 1.0, tt - kf);
  ivec2 i = ivec2(floor(p)); vec2 w = fract(p); w = w * w * (3.0 - 2.0 * w);
  vec2 n = vec2(0.0);
  for (int z = 0; z < 2; z++) {
    int k = int(kf) + z + 5;
    n[z] = mix(mix(rnd3(i, k).x, rnd3(i + ivec2(1, 0), k).x, w.x), mix(rnd3(i + ivec2(0, 1), k).x, rnd3(i + ivec2(1, 1), k).x, w.x), w.y);
  }
  return mix(n.x, n.y, f) - 0.5;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 Rt = texture(uRet, uv);
  vec3 Al = max(texture(uAdapt, uv).rgb, vec3(1e-5));
  float lg = dot(pow(uAglob / Al, vec3(uDl)), vec3(0.62, 0.38, 0.0));   // local (spatial) adaptation
  vec3 lms = Rt.rgb * uGain;
  vec3 rgb = uL2R * lms;
  float Y = dot(rgb, vec3(0.2126, 0.7152, 0.0722));
  float mn = min(rgb.r, min(rgb.g, rgb.b));
  if (mn < 0.0) rgb = mix(vec3(Y), rgb, Y / max(Y - mn, 1e-6));
  rgb = max(rgb, 0.0) * uExpo;
  rgb = rgb * (1.0 + rgb / 16.0) / (1.0 + rgb);
  // Local contrast (floater shadows, afterimages) is kept as Weber contrast: a local tone-mapping step,
  // so the highlight compression above does not flatten shadows the eye would see clearly.
  rgb = min(rgb * (Rt.a * lg), vec3(1.0));
  vec2 vdeg = (gl_FragCoord.xy - uCenter) / uPpd;
  float fl = uSpark * (sparkle(vdeg, uTime) - 0.029) + uShim * 2.0 * shimmer(vdeg / 0.13, uTime);
  rgb = min(rgb * max(1.0 + fl, 0.0), vec3(1.0));
  if (uPhos > 0.002) {
    vec2 v = (gl_FragCoord.xy - uCenter) / uPpd;
    float r = length(v);
    vec2 q = v * 0.085;
    float w1 = fbm(q + vec2(0.0, uTime * 0.11));
    float w2 = fbm(q * 1.7 + vec2(w1 * 2.3, -uTime * 0.08) + 5.2);
    float blot = smoothstep(0.48, 0.78, w2);
    float ring = exp(-sq((r - 30.0 - 3.0 * sin(uTime * 0.7 + atan(v.y, v.x + 1e-4) * 3.0)) / 6.0));
    vec3 col = mix(vec3(0.30, 0.34, 1.0), vec3(0.28, 0.95, 0.58), smoothstep(0.35, 0.65, w1));
    vec3 ph = col * (blot * 0.6 + ring * 0.45) * uPhos * (0.8 + 0.2 * uPulse);
    rgb = 1.0 - (1.0 - rgb) * (1.0 - 0.5 * ph);
  }
  vec3 c = mix(12.92 * rgb, 1.055 * pow(rgb, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, rgb));
  c += (hash(gl_FragCoord.xy + uSeed * 311.0) - 0.5) / 255.0;
  o = vec4(c, 1.0);
}`;

function compile(type, src) {

}

  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i), name = info.name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, info.name); }

}
const R = { w: 0, h: 0, dpr: 1, ping: 0, adaptInit: false };
function initGL() {

  R.ret = program(VS_FULL, FS_RETINA);
  R.adapt = program(VS_FULL, FS_ADAPT);
  R.perc = program(VS_FULL, FS_PERCEIVE);
  R.vaoEmpty = gl.createVertexArray();
  R.vaoBlob = gl.createVertexArray(); gl.bindVertexArray(R.vaoBlob);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  R.instBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, R.instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, INST.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(2, 1);

function makeTarget(w, h, filter) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

function freeTarget(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); } }
function resizeGL() {

  if (w === R.w && h === R.h) return;
  view.width = w; view.height = h; R.w = w; R.h = h; R.dpr = dpr;
  [R.shadowT, R.retT, R.ad && R.ad[0], R.ad && R.ad[1]].forEach(freeTarget);
  R.shadowT = makeTarget(w, h, gl.NEAREST);

function screenGeom() { return { cx: R.w / 2, cy: R.h / 2, ppd: Math.min(R.w, R.h) / 56, w: R.w, h: R.h }; }

// the same perception chain on the CPU, for colouring the explainer
function perceivedRGB(lms) {
  const ad = adaptation();
  const l = [lms[0] * ad.gain[0], lms[1] * ad.gain[1], lms[2] * ad.gain[2]];
  let rgb = apply3(LMS2RGB, l);

// ---------- overlay: hint, lid gauge, explainer — all drawn on a 2D canvas ----------
const ov = document.getElementById('overlay');
const octx = ov.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CSSV = getComputedStyle(document.documentElement), TOK = n => CSSV.getPropertyValue(n).trim();
const INK = TOK('--ink') || '#ffece0', INK_DIM = TOK('--ink-dim') || 'rgba(255,230,212,0.66)';
const LINE = TOK('--line') || 'rgba(255,214,190,0.45)', ACCENT = TOK('--accent') || '#ffb46e';
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

window.addEventListener('touchend', requestTilt);

// ---------- input ----------
function setTargetFromPointer(px, py) {

function setLevel(x) { LID.level = clamp(x, 0, 1); LID.touchedAt = SIM.t; }

window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
view.addEventListener('wheel', e => {
  e.preventDefault();

}, { passive: false });
view.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;

  else if (k === 'h' || k === 'H' || k === '?') UI.hintUntil = SIM.t + 8;
  else if (k === 'n' || k === 'N') { SEED = (SEED * 48271 + 7) % 2147483647; makeEye(SEED); }

  else if (k === '+' || k === '=') setLevel(LID.level + 0.1);
  else if (k === '-' || k === '_') setLevel(LID.level - 0.1);

function fatal(msg) {
